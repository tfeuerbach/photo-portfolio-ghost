services:
  # MySQL Database
  db:
    image: mysql:8.0
    container_name: photo-portfolio-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10

  # Ghost Application
  ghost:
    image: ghost:latest
    container_name: photo-portfolio-ghost
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      database__client: mysql
      database__connection__host: db
      database__connection__user: ${MYSQL_USER}
      database__connection__password: ${MYSQL_PASSWORD}
      database__connection__database: ${MYSQL_DATABASE}

      # Cloudflare Tunnel handles TLS; Ghost still advertises https:// URLs
      url: https://${DOMAIN}
      server__port: 2368
      server__host: 0.0.0.0

      mail__transport: SMTP
      mail__options__service: Gmail
      mail__options__auth__user: ${GMAIL_USER:-}
      mail__options__auth__pass: ${GMAIL_APP_PASSWORD:-}

      NODE_ENV: production
    volumes:
      - ./ghost/content/themes:/var/lib/ghost/content/themes
      - ./ghost/content/images:/var/lib/ghost/content/images
      - ./ghost/content/routes.yaml:/var/lib/ghost/content/settings/routes.yaml:ro
      - ghost_data:/var/lib/ghost/content/data
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:2368/', r => process.exit(r.statusCode < 500 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # Nginx Reverse Proxy (HTTP only — Cloudflare Tunnel terminates TLS)
  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    container_name: photo-portfolio-nginx
    restart: unless-stopped
    depends_on:
      - ghost
    ports:
      - "127.0.0.1:80:80"
    environment:
      - DOMAIN=${DOMAIN}
    volumes:
      - nginx_logs:/var/log/nginx
    networks:
      - app-network
    healthcheck:
      test: ["CMD-SHELL", "nginx -t >/dev/null 2>&1 && pgrep nginx >/dev/null && nc -z 127.0.0.1 80"]
      interval: 1m
      timeout: 10s
      retries: 3
      start_period: 10s

  # Cloudflare Tunnel — exposes the site without opening any ports
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: photo-portfolio-tunnel
    restart: unless-stopped
    depends_on:
      - nginx
    command: tunnel run
    volumes:
      - ./cloudflared:/etc/cloudflared:ro
    networks:
      - app-network

  # Ghost Backup Service
  ghost-backup:
    image: bennetimo/ghost-backup
    container_name: photo-portfolio-backup
    restart: unless-stopped
    depends_on:
      - db
      - ghost
    environment:
      BACKUP_DATABASE: "true"
      BACKUP_CONTENT: "true"
      BACKUP_SCHEDULE: "0 2 * * *"
      MYSQL_HOST: db
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - ./backups:/backups
      - ./ghost/content/themes:/var/lib/ghost/content/themes:ro
      - ./ghost/content/images:/var/lib/ghost/content/images:ro
      - ghost_data:/var/lib/ghost/content/data:ro
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  db_data:
    driver: local
  ghost_data:
    external: true
    name: photo-portfolio_ghost_data
  nginx_logs:
    driver: local
